<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prepaid Resident Water Portal</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #121212; color: #E0E0E0; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1E1E1E; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); border: 1px solid #2C2C2C; }
        h2 { margin: 0 0 8px 0; color: #00B0FF; text-align: center; font-size: 22px; }
        .sub-header { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }
        .balance-box { background: #252525; border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 24px; border: 1px solid #333; }
        .balance-label { font-size: 12px; color: #AAA; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 32px; font-weight: bold; color: #00E676; margin-top: 6px; }
        .switch-container { display: flex; justify-content: space-between; align-items: center; background: #252525; padding: 16px; border-radius: 12px; border: 1px solid #333; }
        .switch-label { font-size: 15px; font-weight: 500; }
        .btn-refresh { width: 100%; margin-top: 20px; padding: 12px; border: none; border-radius: 8px; background: #00B0FF; color: #fff; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-refresh:hover { background: #0091EA; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="houseTitle">Row House --</h2>
    <div class="sub-header">Prepaid Utilities Dashboard</div>
    
    <div class="balance-box">
        <div class="balance-label">Current Balance</div>
        <div class="balance-value" id="balanceValue">₹ --.--</div>
    </div>

    <div class="switch-container">
        <div class="switch-label">🏖️ Holiday Lock Mode</div>
        <input type="checkbox" id="holidayToggle" style="transform: scale(1.5); cursor: pointer;" onchange="toggleHolidayMode()">
    </div>

    <button class="btn-refresh" onclick="fetchHouseData()">🔄 Refresh Balance</button>
</div>

<script>
    // Configuration Variables - Insert your Free Blynk Token and Region ID here
    const BLYNK_TOKEN = "_mcmkcVvihN0eOGZ6x5cJWK6xpqpzakT"; 
    const BLYNK_REGION = "blr1"; // Check your Blynk dashboard URL prefix (e.g. sgp1, lon1, ny3)

    // Automatically parse the URL string to find the user's specific house index
    const urlParams = new URLSearchParams(window.location.search);
    const houseId = parseInt(urlParams.get('house')) || 1; 

    // Calculate dynamic virtual pin channels based on the layout rule
    const balancePin = "V" + houseId;       // House 1 = V1, House 33 = V33
    const holidayPin = "V" + (50 + houseId); // House 1 = V51, House 33 = V83

    document.getElementById("houseTitle").innerText = "Row House " + (houseId < 10 ? "0" + houseId : houseId);

    // Pull real-time data metrics straight out of Blynk Cloud completely free via REST API
    async function fetchHouseData() {
        try {
            const response = await fetch(https://${BLYNK_REGION}.blynk.cloud/external/api/get?token=${BLYNK_TOKEN}&${balancePin}&${holidayPin});
            const data = await response.json();
            
            // Render fetched information directly onto the resident's screen
            document.getElementById("balanceValue").innerText = "₹" + parseFloat(data[balancePin]).toFixed(2);
            document.getElementById("holidayToggle").checked = parseInt(data[holidayPin]) === 1;
        } catch (error) {
            console.error("API Read Error:", error);
            alert("Error updating data from network. Please check internet connection.");
        }
    }

    // Push interactive controls from the custom switch back up to the gateway via Blynk API Webhooks
    async function toggleHolidayMode() {
        const isChecked = document.getElementById("holidayToggle").checked ? 1 : 0;
        try {
            const url = https://${BLYNK_REGION}.blynk.cloud/external/api/update?token=${BLYNK_TOKEN}&${holidayPin}=${isChecked};
            await fetch(url);
            console.log(Holiday Pin ${holidayPin} updated successfully to ${isChecked});
        } catch (error) {
            console.error("API Write Error:", error);
            alert("Failed to commit valve state change.");
        }
    }

    // Trigger an automatic read execution loop when the page loads
    window.onload = fetchHouseData;
</script>
</body>
</html>
