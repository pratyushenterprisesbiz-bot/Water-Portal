<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Water Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="dashboard">
        <h2>House: <span id="house-id">Loading...</span></h2>
        <div id="status">Balance: <span id="balance">--</span></div>
        <button id="holiday-toggle" onclick="toggleHoliday()">Toggle Holiday Mode</button>
        <canvas id="usageChart"></canvas>
    </div>

<script>
    const API_BASE = "https://blynk.cloud/external/api";
    const HOUSE_PIN = "V1"; // Example PIN
    let isHoliday = false;

    async function updateDashboard() {
        try {
            // Promise.race handles slow server response (5s timeout)
            const response = await Promise.race([
                fetch(`${API_BASE}/get?token=YOUR_TOKEN&${HOUSE_PIN}`),
                new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout')), 5000))
            ]);
            
            const data = await response.json();
            document.getElementById('balance').innerText = data || "0";
            renderChart([10, 25, 15, 30, 20]); // Dummy data if API call is light
        } catch (err) {
            console.error("Fetch Error:", err);
            document.getElementById('balance').innerText = "Offline";
            renderChart([0, 0, 0, 0, 0]); // Render zero-state chart
        }
    }

    async function toggleHoliday() {
        isHoliday = !isHoliday;
        // API call to update state
        try {
            await fetch(`${API_BASE}/update?token=YOUR_TOKEN&V2=${isHoliday ? 1 : 0}`);
            alert(`Holiday Mode: ${isHoliday ? "ON" : "OFF"}`);
        } catch (e) {
            alert("Failed to update server");
        }
    }

    function renderChart(data) {
        const ctx = document.getElementById('usageChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                datasets: [{ label: 'Liters', data: data, backgroundColor: 'blue' }]
            }
        });
    }

    // Initialize
    updateDashboard();
</script>
</body>
</html>
